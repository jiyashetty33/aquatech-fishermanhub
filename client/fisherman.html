<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fisherman Dashboard</title>
    <link rel="stylesheet" href="css/fisherman.css" />
  </head>
  <body>
    <div class="fisherman-app">
      <header class="topbar">
        <div>
          <h1>Fisherman Hub</h1>
          <p id="userLabel">Welcome</p>
        </div>
        <div class="top-actions">
          <select id="languageSelect">
            <option value="en">English</option>
            <option value="kn">ಕನ್ನಡ</option>
            <option value="tulu">ತುಳು</option>
            <option value="ml">മലയാളം</option>
          </select>
          <button id="logoutBtn" class="secondary">Logout</button>
        </div>
      </header>

      <main class="dashboard-grid">
        <section class="card panel">
          <h3>My Vessel</h3>
          <div id="vesselInfo"></div>
        </section>

        <section class="card panel">
          <h3>Vessel Status</h3>
          <button id="statusDeparted">Set Departed</button>
          <button id="statusReturning">Set Returning</button>
          <button id="statusDocked">Set Docked</button>
          <div id="statusResult" class="status-box"></div>
        </section>

        <section class="card panel">
          <h3>My Fishing Trip</h3>
          <div id="tripInfo"></div>
        </section>

        <section class="card panel">
          <h3>Record Catch</h3>
          <form id="catchForm">
            <select id="catchSpecies" required>
              <option value="">Select fish species</option>
            </select>
            <input id="catchQuantity" type="number" placeholder="Quantity" required />
            <input id="catchLocation" placeholder="Location" />
            <button type="submit">Save Catch</button>
            <div id="catchResult" class="status-box" aria-live="polite"></div>
          </form>
        </section>

        <section class="card panel">
          <h3>My Fish Listings</h3>
          <form id="listingForm">
            <select id="listingSpecies" required>
              <option value="">Select fish from your catch</option>
            </select>
            <div id="listingAvailable" class="available-quantity" aria-live="polite"></div>
            <input id="listingQuantity" type="number" placeholder="Quantity" required />
            <input id="listingPrice" type="number" placeholder="Price per kg" required />
            <select id="listingType">
              <option value="DIRECT_SALE">Direct Sale</option>
              <option value="AUCTION">Auction</option>
            </select>
            <button type="submit">Create Listing</button>
          </form>
          <div id="listingList"></div>
        </section>

        <section class="card panel voice-entry">
          <div>
            <span class="eyebrow">Fisherman Hub</span>
            <h3>Voice Assistant</h3>
            <p>Speak naturally to manage your vessel, catch, listings, auctions and more.</p>
          </div>
          <a class="voice-link" href="voice-assistant.html" aria-label="Open Voice Assistant">
            <span class="voice-icon" aria-hidden="true">&#127908;</span>
            <span>Open assistant <span aria-hidden="true">&#8594;</span></span>
          </a>
        </section>

        <section class="card panel">
          <h3>My Orders</h3>
          <div id="ordersList"></div>
        </section>

        <section class="card panel">
          <h3>My Earnings</h3>
          <div id="earningsInfo"></div>
        </section>

        <section class="card panel">
          <h3>Market Prices</h3>
          <div id="priceList"></div>
        </section>

        <section class="card panel">
          <h3>Notifications</h3>
          <div id="notificationsList"></div>
        </section>
      </main>
    </div>

    <script src="js/translations.js"></script>
    <script src="js/fishSpecies.js"></script>
    <script src="js/api.js"></script>
    <script src="js/fisherman.js"></script>
  </body>
</html>
